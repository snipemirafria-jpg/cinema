name: Converter uploads para HLS
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Verificar segredos
        id: s
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then echo "Configure os segredos SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY"; echo "ok=false" >> $GITHUB_OUTPUT; else echo "ok=true" >> $GITHUB_OUTPUT; fi
      - if: steps.s.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - if: steps.s.outputs.ok == 'true'
        run: npm i --no-save @supabase/supabase-js@2 && node scripts/converter-hls.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
