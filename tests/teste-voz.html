<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/app.css"></head><body>
<!-- Teste da voz por sala com Supabase simulado: ?sala=A&nome=Ana -->
<section id="tela-cinema" class="tela" style="display:block"><div class="topo"><button class="chip" id="btn-pessoas">👥</button></div></section>
<script type="module">
import { criarSbFalso } from './mock-supa-voz.js';
import { iniciarVozUI } from '../js/voz-ui.js';
const q = new URLSearchParams(location.search);
window.sb = criarSbFalso();
window.toasts = [];
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
window.gv = iniciarVozUI({ sb: window.sb, sala: q.get('sala') || 'A', eu: { id: q.get('id') || q.get('nome'), apelido: q.get('nome') || 'Teste', cor: '#7c3aed' }, player: { volumeFilme: 1, definirVolume() {} }, toast: (t) => toasts.push(t), esc });
window.PRONTO = 1;
</script></body></html>
