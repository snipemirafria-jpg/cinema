<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/app.css">
<!-- Teste das SALAS TEMÁTICAS (?genero=Terror ou ?genero=Comédia, Paródia) sobre a sala real.
     Baseado no teste do Cinema VR com a SALA REAL (js/cinema3d.js) e o player REAL (js/player.js).
     Só o Supabase é trocado por um falso (sem rede): o "servidor" da sessão é simulado aqui.
     ?modo=livre  -> o filme da sessão toca num <video> HTML sobre o telão (como Drive / MP4 sem CORS)
     ?filme=...   -> outro arquivo de vídeo (padrão: filme.webm) -->
<script type="importmap">{"imports":{
  "three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/",
  "../js/supa.js":"data:text/javascript,export const sb={channel(){return{on(){return this},subscribe(){return this}}},rpc:async()=>({data:null,error:null}),removeChannel(){}};export const urlPublica=(b,p)=>p;export const esc=(s)=>String(s??'').replace(/[<>&\u0022]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','\u0022':'&quot;'}[c]));"
}}</script></head>
<body>
<section id="tela-cinema" class="tela">
  <canvas id="cena3d"></canvas><div id="rotulos"></div>
  <video id="video" playsinline webkit-playsinline crossorigin="anonymous" muted preload="auto"></video>
  <nav class="menu-lateral" id="menu-lateral"><button data-ir="sala" class="ativo">🎬<span>Sala</span></button><button data-ir="sair">🚪<span>Sair</span></button></nav>
</section>
<script type="module">
import { Cinema } from '../js/cinema3d.js';
import { PlayerSincronizado } from '../js/player.js';
const q = new URLSearchParams(location.search);
const modo = q.get('modo') || 'textura';
const arquivo = new URL(q.get('filme') || 'filme.webm', location.href).href;
const video = document.getElementById('video');
const c = new Cinema(document.getElementById('cena3d'), document.getElementById('rotulos'), video);
c.meuId = 'u0';
const nomes = ['Rone333', 'LucasBR', 'Tainar', 'AnaVitoria', 'VictorHugo', 'Bia', 'Leo', 'Duda'];
const roupas = ['#151515', '#c1121f', '#1d4ed8', '#f2f2f2', '#7c3aed', '#16a34a'];
await c.atualizarPessoas(nomes.map((n, i) => ({ id: 'u' + i, apelido: n, papel: i ? 'espectador' : 'owner', desde: i,
  avatar: { base: i % 2 ? 'female' : 'male', cabelo: i % 2 ? 'long' : 'simpleparted', roupa: roupas[i % 6], pele: ['#f3d2b8', '#c68e6b', '#7a4a2f'][i % 3] } })));

// sessão simulada: começou há 5 s, filme de 10 min
const filme = { titulo: 'Filme de teste', genero: q.get('genero') || '', origem: 'link', fonte_url: arquivo, duracao_seg: 600, legendas: [] };
const player = new PlayerSincronizado(video, {
  aoModo: (m, el) => c.mostrarNaTela(el),
  aoEstado: (s) => { if (s === 'tocando' && player.modo === 'textura') c.mostrarVideo(true); },
});
player.atualizar = async () => player._corrigir(true);   // sem servidor: só corrige o ponto
// o vídeo de teste é curto: a sessão simulada dá voltas nele (como uma sessão que recomeça)
const posReal = player.posicaoAlvo.bind(player);
player.posicaoAlvo = () => { const d = player.m.duration; const p = posReal(); return isFinite(d) && d > 2 ? p % (d - 1) : p; };
player.estado = { filme, item: 't1', iniciado_em: new Date(Date.now() - 5000).toISOString(), pausado: false };
player.itemAtual = 't1';
video.loop = true; player.vLivre.loop = true;   // vídeo curto: continua em volta
if (modo === 'livre') player._tocarLivre(arquivo);
else await player._carregar(filme);
window.CineOnline = { player, cinema: c };
c.aplicarTema(filme);
window.tema = (genero) => c.aplicarTema({ ...filme, genero });
c.focarEm('u0', true);
await import('../integrations/vr/index.js');
window.PRONTO = 1;
</script></body></html>
