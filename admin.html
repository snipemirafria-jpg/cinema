<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b14">
  <title>Painel do Criador · Cine Online</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/admin.css">

<body>
  <div id="bloqueio" class="bloqueio">Verificando permissão…</div>

      <nav>
        <button data-sec="dashboard" class="ativo">📊 Dashboard</button>
        <button data-sec="programacao">🗓️ Programação</button>
        <button data-sec="filmes">🎞️ Filmes</button>
        <button data-sec="usuarios">👥 Usuários</button>

      <a class="voltar-sala" href="./">🎬 Voltar para a sala</a>
    </aside>
    <main>
      <header class="topo"><button class="menu-mob" id="menu-mob">☰</button><h1 id="titulo-sec">Dashboard</h1><div class="eu" id="eu"></div></header>
      <section id="conteudo"></section>
    </main>
  </div>

  <dialog id="modal" class="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="toasts"></div>
  <script type="module" src="js/admin.js?v=20"></script>
</body>
</html>
